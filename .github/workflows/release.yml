name: release

# Tag-driven release: push a v* tag (scripts/release.sh does this) and CI
# builds both APK variants and attaches them to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build APKs and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Both variants land at the same output path, so each is copied aside
      # right after its build.
      - name: Build DLNA APK (default flags)
        run: |
          ./gradlew assembleDebug --console=plain
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/app-debug.apk

      - name: Build AirPlay APK (experimental mirror)
        run: |
          ./gradlew assembleDebug -Pkbtv.flags.airplay=true --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk out/app-debug-airplay.apk

      # releases/<tag>/VERSION_<tag>.md is the project changelog; GitHub's
      # auto-generated notes get appended after it.
      - name: Locate changelog
        id: changelog
        run: |
          f="releases/${GITHUB_REF_NAME}/VERSION_${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: true
          files: out/*.apk
