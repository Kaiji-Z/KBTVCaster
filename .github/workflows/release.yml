name: release

# Tag-driven release: push a v* tag (scripts/release.sh does this) and CI
# builds the single signed full-featured release APK and attaches it to a
# GitHub Release. Signing key is delivered via secrets (KBTV_KEYSTORE_BASE64,
# KBTV_KEYSTORE_PASSWORD, KBTV_KEY_ALIAS, KBTV_KEY_PASSWORD).
# Release builds force FLAG_AIRPLAY_PROTOCOL + FLAG_PLAYER_MENU on
# (app/build.gradle.kts release buildType), so one APK ships everything.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Decode signing key
        run: echo "${{ secrets.KBTV_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/kbtv.keystore"

      - name: Build release APK
        env:
          KBTV_KEYSTORE_PATH: ${{ runner.temp }}/kbtv.keystore
          KBTV_KEYSTORE_PASSWORD: ${{ secrets.KBTV_KEYSTORE_PASSWORD }}
          KBTV_KEY_ALIAS: ${{ secrets.KBTV_KEY_ALIAS }}
          KBTV_KEY_PASSWORD: ${{ secrets.KBTV_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools/"*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk

      # releases/<tag>/VERSION_<tag>.md is the project changelog; GitHub's
      # auto-generated notes get appended after it.
      - name: Locate changelog
        id: changelog
        run: |
          f="releases/${GITHUB_REF_NAME}/VERSION_${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "path=" >> "$GITHUB_OUTPUT"; fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.changelog.outputs.path }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
